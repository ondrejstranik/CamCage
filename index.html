<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CamCage</title>

  <!-- PWA Manifest -->
  <link rel="manifest" href="/CamCage/manifest.webmanifest">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="canonical" href="https://ondrejstranik.github.io/CamCage/" />
  <meta name="theme-color" content="#007bff">

  <!-- PWA iOS Support -->
  <link rel="apple-touch-icon" href="/CamCage/icons/icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
</head>

<body>
  <h1>CamCage</h1>
  <p><strong>Instruction</strong></p>
  <p>1. install this webpage as PWA on your device and run it</p>
  <p>2. connected your device to WiFi network named <strong>esp32</strong>.</p>
  <p>3. switch off the mobile phone network.</p>

  <div id="message">Checking network...</div>
  <div class="note" id="statusNote"></div>

  <button class="btn" id="wifiBtn">Open WiFi Settings</button>
  <a class="btn" href="http://192.168.4.1" target="_blank">Run camera</a>

  <script>
    if (navigator.serviceWorker) {
      navigator.serviceWorker.register (
        '/CamCage/sw.js',
        {scope: '/CamCage/'}
      )
    }
  </script>

  <script src="js/app.js"></script>

</body>
</html>
