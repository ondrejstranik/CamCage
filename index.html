<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Network Check</title>
  <style>
    body { font-family: sans-serif; padding: 2rem; }
    #message { margin-top: 1rem; font-size: 1.2rem; }
    .btn { display: block; margin-top: 1rem; padding: 0.75rem 1rem; font-size: 1rem; text-decoration: none; background: #007bff; color: white; border-radius: 8px; width: fit-content; }
    .note { margin-top: 1rem; color: #ff0000; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Network Status</h1>
  <p>Please ensure your device is connected to the WiFi network named <strong>"esp32"</strong>.</p>

  <div id="message">Checking network...</div>
  <div class="note" id="cellNote"></div>

  <button class="btn" id="wifiBtn">Open WiFi Settings</button>
  <a class="btn" href="http://192.168.4.1" target="_blank">Open ESP32 Page</a>

  <script>
    function checkNetwork() {
      const msg = document.getElementById('message');
      const cellNote = document.getElementById('cellNote');

      if (!('connection' in navigator)) {
        msg.textContent = 'Your browser does not support network detection.';
        return;
      }

      const type = navigator.connection.type || navigator.connection.effectiveType;

      if (type && type.includes('cell')) {
        msg.textContent = 'You are currently on a mobile network.';
        cellNote.textContent = 'Please switch off your cellular/mobile data and connect to WiFi (esp32).';
      } else if (type && type.includes('wifi')) {
        msg.textContent = 'You are on a WiFi network.';
        cellNote.textContent = '';
      } else {
        msg.textContent = 'Network type could not be clearly detected.';
        cellNote.textContent = '';
      }
    }

    window.addEventListener('load', checkNetwork);

    document.getElementById('wifiBtn').addEventListener('click', () => {
      const ua = navigator.userAgent.toLowerCase();
      if (ua.includes('android')) {
        window.location.href = 'intent://#Intent;scheme=android.settings.WIFI_SETTINGS;end';
      } else if (ua.includes('windows')) {
        window.location.href = 'ms-settings:network-wifi';
      } else if (ua.includes('iphone') || ua.includes('ipad') || ua.includes('ipod')) {
        window.location.href = 'App-Prefs:root=WIFI';
      } else {
        alert('Your device does not support automatic opening of WiFi settings. Please open it manually.');
      }
    });
  </script>
</body>
</html>
