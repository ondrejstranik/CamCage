<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CamCage</title>
  <style>
    body { font-family: sans-serif; padding: 2rem; }
    #message { margin-top: 1rem; font-size: 1.2rem; }
    .btn { display: block; margin-top: 1rem; padding: 0.75rem 1rem; font-size: 1rem; text-decoration: none; background: #007bff; color: white; border-radius: 8px; width: fit-content; }
    .note { margin-top: 1rem; color: #ff0000; font-weight: bold; }
  </style>
<!-- PWA Manifest -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#007bff">


<!-- PWA iOS Support -->
<link rel="apple-touch-icon" href="icons/icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">




</head>
<body>
  <h1>CamCage</h1>
  <p><strong>Instruction</strong></p>
  <p>1. install this webpage as PWA on your device and run it</p>
  <p>2. connected your device to WiFi network named <strong>esp32</strong>.</p>
  <p>3. switch off the mobile phone network.</p>

  <div id="message">Checking network...</div>
  <div class="note" id="statusNote"></div>

  <button class="btn" id="wifiBtn">Open WiFi Settings</button>
  <a class="btn" href="http://192.168.4.1" target="_blank">Run camera</a>

  <script>
    function checkNetwork() {
      const msg = document.getElementById('message');
      const statusNote = document.getElementById('statusNote');

      let isCell = false;
      let isWifi = false;

      if ('connection' in navigator) {
        const type = navigator.connection.type || navigator.connection.effectiveType;
        if (type && type.includes('cell')) isCell = true;
        if (type && type.includes('wifi')) isWifi = true;
      }

      let statusMsg = 'Network status: ';
      if (isWifi && isCell) statusMsg += 'Both WiFi and mobile are active.';
      else if (isWifi) statusMsg += 'WiFi only.';
      else if (isCell) statusMsg += 'mobile network only.';
      else statusMsg += 'Cannot determine or no connection.';

      msg.textContent = statusMsg;
    }

    window.addEventListener('load', checkNetwork);

    document.getElementById('wifiBtn').addEventListener('click', () => {
      // Robust detection of Android, Windows, iOS
      const ua = (navigator.userAgent || navigator.vendor || window.opera || '').toLowerCase();
      if (ua.includes('android')) {
        // Android Chrome/Firefox
        try {
          //window.location.href = 'intent://wifi/#Intent;scheme=android.settings.WIFI_SETTINGS;end';
          window.location.href = "intent:#Intent;action=android.settings.WIFI_SETTINGS;end;"
        } catch (e) {
          alert('Please open WiFi settings manually on your Android device.');
        }
      } else if (ua.includes('windows')) {
        // Windows PC
        window.location.href = 'ms-settings:network-wifi';
      } else if (ua.includes('iphone') || ua.includes('ipad') || ua.includes('ipod')) {
        // iOS devices
        window.location.href = 'App-Prefs:root=WIFI';
      } else {
        alert('Your device does not support automatic opening of WiFi settings. Please open it manually.');
      }
    });
  </script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("service-worker.js");
    }
  </script>

</body>
</html>
